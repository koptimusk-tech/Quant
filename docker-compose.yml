services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qal
      POSTGRES_PASSWORD: qal
      POSTGRES_DB: qal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qal"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      QAL_DATABASE_URL: postgresql+psycopg://qal:qal@db:5432/qal
      QAL_DATA_DIR: /data
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - qaldata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  qaldata:
