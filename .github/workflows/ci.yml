name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qal
          POSTGRES_PASSWORD: qal
          POSTGRES_DB: qal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qal" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[postgres,dev]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          QAL_TEST_DATABASE_URL: postgresql+psycopg://qal:qal@localhost:5432/qal_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - run: pip install -e "./backend"
      - name: Load the synthetic demo and start the API (serving the built UI)
        working-directory: backend
        env:
          QAL_DATABASE_URL: sqlite:///${{ runner.temp }}/qal.db
          QAL_DATA_DIR: ${{ runner.temp }}/data
          QAL_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
        run: |
          python -m qal.cli demo
          nohup python -m qal.server --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          QAL_WEB_URL: http://127.0.0.1:8000
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log"
